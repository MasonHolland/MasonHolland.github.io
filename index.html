<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mason</title>
  <meta name="description" content="Mason's portfolio. Read a short resume and project list, or walk through a room to explore the work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <main class="landing">
    <div class="landing__intro">
      <h1 class="landing__name" id="name">Mason</h1>
      <p class="landing__line" id="headline">Replace this with one line about what you do</p>
    </div>

    <nav class="landing__stage" aria-label="Choose how to explore">
      <a class="door door--simple" href="resume.html">
        <span class="door__frame">
          <span class="door__light"></span>
          <span class="door__leaf"><span class="door__handle"></span></span>
        </span>
        <span class="door__plaque">Read the short version
          <small>Resume and projects on one page</small>
        </span>
      </a>

      <a class="door door--room" href="room.html">
        <span class="door__frame">
          <span class="door__light"></span>
          <span class="door__leaf"><span class="door__handle"></span></span>
        </span>
        <span class="door__plaque">Walk into the room
          <small>Explore a study with my awards, projects and bookshelf</small>
        </span>
      </a>
    </nav>

    <div class="landing__floor" aria-hidden="true"></div>
  </main>

  <script>
    // Light the room door once the page has loaded.
    window.addEventListener("load", function () {
      setTimeout(function () {
        var d = document.querySelector(".door--room");
        if (d) d.classList.add("is-lit");
      }, 500);
    });

    // Fill the name and headline from the shared data file. The static text above is the fallback.
    fetch("data/profile.json")
      .then(function (r) { return r.json(); })
      .then(function (p) {
        document.getElementById("name").textContent = p.name;
        document.getElementById("headline").textContent = p.headline;
        document.title = p.name;
      })
      .catch(function () {});
  </script>
</body>
</html>
