<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume and projects</title>
  <meta name="description" content="Work history, projects and awards on one page.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div class="page">
    <div class="page__top">
      <a href="index.html">Back to the doors</a>
      <a href="room.html">Walk into the room instead</a>
    </div>

    <header>
      <h1 id="name"></h1>
      <p class="page__headline" id="headline"></p>
      <p class="page__summary" id="summary"></p>
      <ul class="page__links" id="links"></ul>
    </header>

    <main>
      <section aria-labelledby="h-exp">
        <h2 id="h-exp">Experience</h2>
        <div id="experience"></div>
      </section>

      <section aria-labelledby="h-proj">
        <h2 id="h-proj">Projects</h2>
        <div id="projects"></div>
      </section>

      <section aria-labelledby="h-acc">
        <h2 id="h-acc">Awards, certificates and education</h2>
        <div id="accolades"></div>
      </section>

      <section aria-labelledby="h-books">
        <h2 id="h-books">Recently read</h2>
        <div id="books"></div>
      </section>
    </main>
  </div>

  <script>
    function el(tag, attrs, children) {
      var n = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]);
      });
      (children || []).forEach(function (c) { if (c) n.appendChild(c); });
      return n;
    }

    function entry(title, when, body, extra) {
      return el("article", { "class": "entry" }, [
        el("div", { "class": "entry__head" }, [
          el("h3", { text: title }),
          when ? el("span", { "class": "entry__when", text: when }) : null
        ]),
        body ? el("p", { text: body }) : null
      ].concat(extra || []));
    }

    Promise.all([
      fetch("data/profile.json").then(function (r) { return r.json(); }),
      fetch("data/books.json").then(function (r) { return r.json(); }).catch(function () { return { books: [] }; })
    ]).then(function (res) {
      var p = res[0], b = res[1];
      document.title = p.name + " – resume and projects";
      document.getElementById("name").textContent = p.name;
      document.getElementById("headline").textContent = p.headline;
      document.getElementById("summary").textContent = p.summary;

      var links = document.getElementById("links");
      p.links.forEach(function (l) {
        var li = el("li", {}, [el("a", { href: l.url, text: l.label })]);
        links.appendChild(li);
      });

      var exp = document.getElementById("experience");
      p.experience.forEach(function (x) {
        var ul = x.highlights && x.highlights.length
          ? el("ul", {}, x.highlights.map(function (h) { return el("li", { text: h }); }))
          : null;
        exp.appendChild(entry(x.role + ", " + x.org, x.start + " to " + x.end, x.summary, [ul]));
      });

      var proj = document.getElementById("projects");
      p.projects.forEach(function (x) {
        var tags = x.tags && x.tags.length
          ? el("ul", { "class": "tags" }, x.tags.map(function (t) { return el("li", { text: t }); }))
          : null;
        var a = x.url ? el("p", {}, [el("a", { href: x.url, text: "View " + x.title })]) : null;
        proj.appendChild(entry(x.title, x.year, x.summary, [tags, a]));
      });

      var acc = document.getElementById("accolades");
      p.accolades.forEach(function (x) {
        acc.appendChild(entry(x.title + ", " + x.from, x.year, x.summary));
      });

      var books = document.getElementById("books");
      var list = (b.books || []).slice(0, 8);
      if (!list.length) {
        document.getElementById("h-books").parentNode.hidden = true;
      } else {
        list.forEach(function (x) {
          var stars = x.rating ? x.rating + " out of 5" : "";
          books.appendChild(entry(x.title, stars, "by " + x.author));
        });
      }
    });
  </script>
</body>
</html>
