<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume</title>
  <meta name="description" content="Work history, skills and education on one page.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body class="theme-work">
  <header class="site-nav">
    <a class="site-nav__brand" href="index.html" data-name>Mason Holland</a>
    <nav aria-label="Site">
      <ul>
        <li><a href="resume.html" aria-current="page">Resume</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a class="site-nav__room" href="room.html">Walk into the room</a></li>
      </ul>
    </nav>
  </header>

  <div class="page">

    <header>
      <h1 id="name"></h1>
      <p class="page__headline" id="headline"></p>
      <p class="page__location" id="location"></p>
      <p class="page__summary" id="summary"></p>
      <ul class="page__links" id="links"></ul>
    </header>

    <main>
      <section aria-labelledby="h-exp">
        <h2 id="h-exp">Experience</h2>
        <div id="experience"></div>
      </section>

      <section aria-labelledby="h-wins">
        <h2 id="h-wins">Accomplishments</h2>
        <ul class="page__list" id="accomplishments"></ul>
      </section>

      <section aria-labelledby="h-skills">
        <h2 id="h-skills">Skills</h2>
        <ul class="skill-tiles" id="skills"></ul>
      </section>

      <section aria-labelledby="h-acc">
        <h2 id="h-acc">Awards, certificates and education</h2>
        <div id="accolades"></div>
      </section>
    </main>
  </div>

  <script src="assets/site.js"></script>
  <script>

    function entry(title, when, body, extra) {
      return el("article", { "class": "entry" }, [
        el("div", { "class": "entry__head" }, [
          el("h3", { text: title }),
          when ? el("span", { "class": "entry__when", text: when }) : null
        ]),
        body ? el("p", { text: body }) : null
      ].concat(extra || []));
    }

    loadJSON("data/profile.json", {}).then(function (p) {
      fillName(p);
      document.getElementById("name").textContent = p.name;
      document.getElementById("headline").textContent = p.headline;
      document.getElementById("summary").textContent = p.summary;
      document.getElementById("location").textContent = p.location || "";
      // a section with nothing in it is hidden
      var hide = function (id) { document.getElementById(id).parentNode.hidden = true; };

      var links = document.getElementById("links");
      p.links.forEach(function (l) {
        var li = el("li", {}, [el("a", { href: l.url, text: l.label })]);
        links.appendChild(li);
      });

      var exp = document.getElementById("experience");
      p.experience.forEach(function (x) {
        var ul = x.highlights && x.highlights.length
          ? el("ul", {}, x.highlights.map(function (h) { return el("li", { text: h }); }))
          : null;
        var where = x.location ? el("p", { "class": "entry__where", text: x.location }) : null;
        var job = entry(x.role + ", " + x.org, x.start + " to " + x.end, x.summary, [where, ul]);
        job.classList.add("entry--job");
        exp.appendChild(job);
      });

      var wins = p.accomplishments || [];
      if (!wins.length) hide("h-wins");
      wins.forEach(function (w) { document.getElementById("accomplishments").appendChild(el("li", { text: w })); });

      var skills = p.skills || {};
      if (!(skills.expertise || []).length && !(skills.technical || []).length) hide("h-skills");
      // one tile per skill, like the skill shelf in the Work room: areas of expertise, then the tools
      var tiles = document.getElementById("skills");
      (skills.expertise || []).forEach(function (t) { tiles.appendChild(el("li", { text: t })); });
      (skills.technical || []).forEach(function (t) {
        tiles.appendChild(el("li", { "class": "is-tech" }, [document.createTextNode(t.label), el("span", { text: t.items })]));
      });

      var acc = document.getElementById("accolades");
      if (!(p.accolades || []).length) hide("h-acc");
      else if (p.accolades.every(function (x) { return x.kind === "degree"; })) document.getElementById("h-acc").textContent = "Education";
      p.accolades.forEach(function (x) {
        acc.appendChild(entry(x.title + ", " + x.from, x.year, x.summary));
      });

    });
  </script>
</body>
</html>
