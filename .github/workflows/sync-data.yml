name: Sync books and games

on:
  schedule:
    - cron: "17 18 * * *"   # once a day (18:17 UTC)
  workflow_dispatch:         # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Goodreads
        continue-on-error: true
        env:
          GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}
        run: node scripts/sync-goodreads.mjs

      - name: Sync Steam and PlayStation
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
        run: node scripts/sync-games.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/books.json data/games.json data/genres.json
          if [ -d assets/covers ]; then git add assets/covers; fi
          if [ -d assets/books/covers ]; then git add assets/books/covers; fi
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Sync books and games"
            git push
          fi
